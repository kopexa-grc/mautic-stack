apiVersion: v2
name: mautic
description: Hardened, always up-to-date Mautic for Kubernetes — web, queue workers, cron jobs, SAML SSO, MCP server for AI assistants (OAuth 2.1), optional MariaDB and restic backups.
type: application
# Patch releases are cut automatically by CI whenever the chart changes.
version: 0.3.4
# renovate: datasource=packagist depName=mautic/recommended-project
appVersion: "7.2.2"
kubeVersion: ">=1.29.0-0"
home: https://github.com/kopexa-grc/mautic-stack
sources:
  - https://github.com/kopexa-grc/mautic-stack
  - https://github.com/kopexa-grc/images
  - https://github.com/mautic/mautic
keywords: [mautic, marketing-automation, email, newsletter, crm, saml, sso, mcp, oauth2, ai]
maintainers:
  - name: Kopexa
    url: https://kopexa.com
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/kopexa-grc/mautic-stack#readme
    - name: Hardened base images
      url: https://github.com/kopexa-grc/images
    - name: Support
      url: https://github.com/kopexa-grc/mautic-stack/issues
    - name: Kopexa
      url: https://kopexa.com
  artifacthub.io/images: |
    - name: mautic
      image: ghcr.io/kopexa-grc/mautic:7.2.2
    - name: restic
      image: ghcr.io/kopexa-grc/restic:0.19
    - name: mariadb
      image: docker.io/library/mariadb:11.4
