# External DB fully from an operator connection secret, backup credentials
# from secrets/configmaps with non-standard key names.
mautic:
  siteUrl: https://mautic.example.com
mariadb:
  enabled: false
externalDatabase:
  host: ""
  existingSecret: mautic-connection
  secretKeys: {host: host, port: port, database: database, username: username, password: password}
backup:
  enabled: true
  configMapEnv:
    RESTIC_REPOSITORY: {name: mautic-bucket, key: RESTIC_REPOSITORY}
  secretEnv:
    RESTIC_PASSWORD: {name: mautic-backup, key: restic-password}
    AWS_ACCESS_KEY_ID: {name: mautic-bucket, key: AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: {name: mautic-bucket, key: AWS_SECRET_ACCESS_KEY}
