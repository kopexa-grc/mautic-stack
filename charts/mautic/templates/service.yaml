apiVersion: v1
kind: Service
metadata:
  name: {{ include "mautic.fullname" . }}
  labels:
    {{- include "mautic.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
  {{- with (merge (dict) .Values.service.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "mautic.componentSelector" (dict "ctx" . "component" "web") | nindent 4 }}
