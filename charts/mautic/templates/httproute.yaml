{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mautic.fullname" . }}
  labels:
    {{- include "mautic.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
  {{- with (merge (dict) .Values.httpRoute.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Defaults the API server fills in are spelled out (here and in
  # backendRefs), so GitOps tools (Argo CD, Flux) see no permanent diff.
  parentRefs:
    {{- $refs := list }}
    {{- range (required "httpRoute.parentRefs is required (the Gateway to attach to)" .Values.httpRoute.parentRefs) }}
    {{- $refs = append $refs (merge (dict) . (dict "group" "gateway.networking.k8s.io" "kind" "Gateway")) }}
    {{- end }}
    {{- toYaml $refs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- toYaml .Values.httpRoute.matches | nindent 8 }}
      {{- with .Values.httpRoute.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "mautic.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
