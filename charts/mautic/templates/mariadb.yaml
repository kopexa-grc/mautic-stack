{{- if .Values.mariadb.enabled }}
{{- $name := include "mautic.mariadb.fullname" . }}
{{- if not .Values.mariadb.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mautic.componentLabels" (dict "ctx" . "component" "mariadb") | nindent 4 }}
  {{- include "mautic.annotations" . | nindent 2 }}
type: Opaque
data:
  mariadb-password: {{ include "mautic.secretValue" (dict "ctx" . "name" $name "key" "mariadb-password" "length" 32) }}
  mariadb-root-password: {{ include "mautic.secretValue" (dict "ctx" . "name" $name "key" "mariadb-root-password" "length" 32) }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "mautic.componentLabels" (dict "ctx" . "component" "mariadb") | nindent 4 }}
  {{- include "mautic.annotations" . | nindent 2 }}
data:
  mautic.cnf: |
    {{- .Values.mariadb.config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "mautic.componentLabels" (dict "ctx" . "component" "mariadb") | nindent 4 }}
  {{- include "mautic.annotations" . | nindent 2 }}
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    {{- include "mautic.componentSelector" (dict "ctx" . "component" "mariadb") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "mautic.componentLabels" (dict "ctx" . "component" "mariadb") | nindent 4 }}
  {{- include "mautic.annotations" . | nindent 2 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "mautic.componentSelector" (dict "ctx" . "component" "mariadb") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mautic.componentLabels" (dict "ctx" . "component" "mariadb") | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.mariadb.config | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: {{ include "mautic.imageRef" (dict "image" .Values.mariadb.image "default" "11.4") }}
          imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.auth.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.auth.username | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mautic.mariadb.secretName" . }}
                  key: mariadb-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mautic.mariadb.secretName" . }}
                  key: mariadb-root-password
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
          ports:
            - name: mysql
              containerPort: 3306
          startupProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [healthcheck.sh, --connect]
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d/mautic.cnf
              subPath: mautic.cnf
              readOnly: true
            - name: run
              mountPath: /run/mysqld
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if not .Values.mariadb.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.mariadb.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mariadb.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mariadb.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.mariadb.persistence.enabled }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "mautic.componentSelector" (dict "ctx" . "component" "mariadb") | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.mariadb.persistence.accessModes | nindent 10 }}
        {{- with .Values.mariadb.persistence.storageClass }}
        storageClassName: {{ if eq . "-" }}""{{ else }}{{ . | quote }}{{ end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mariadb.persistence.size }}
  {{- end }}
{{- end }}
