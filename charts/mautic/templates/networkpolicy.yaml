{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mautic.fullname" . }}-web
  labels:
    {{- include "mautic.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mautic.componentSelector" (dict "ctx" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.webIngressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# worker and cron pods serve nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mautic.fullname" . }}-jobs
  labels:
    {{- include "mautic.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Release.Name | quote }}]
      - key: app.kubernetes.io/component
        operator: In
        values: [worker, cron, backup]
  policyTypes: [Ingress]
  ingress: []
{{- if .Values.mariadb.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mautic.mariadb.fullname" . }}
  labels:
    {{- include "mautic.componentLabels" (dict "ctx" . "component" "mariadb") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mautic.componentSelector" (dict "ctx" . "component" "mariadb") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "mautic.selectorLabels" . | nindent 14 }}
      ports:
        - port: mysql
{{- end }}
{{- if .Values.networkPolicy.egress.enabled }}
---
# Egress allow-list for every Mautic pod (web, worker, cron, init, backup).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mautic.fullname" . }}-egress
  labels:
    {{- include "mautic.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Release.Name | quote }}]
      - key: app.kubernetes.io/component
        operator: In
        values: [web, worker, cron, backup, test]
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml (list .Values.networkPolicy.egress.dnsSelector) | nindent 8 }}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- if .Values.mariadb.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "mautic.componentSelector" (dict "ctx" . "component" "mariadb") | nindent 14 }}
      ports:
        - port: 3306
    {{- end }}
    # helm test pod -> web
    - to:
        - podSelector:
            matchLabels:
              {{- include "mautic.componentSelector" (dict "ctx" . "component" "web") | nindent 14 }}
      ports:
        - port: 8080
    {{- with .Values.networkPolicy.egress.to }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
