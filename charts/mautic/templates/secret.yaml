{{- $name := include "mautic.secretName" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mautic.labels" . | nindent 4 }}
  annotations:
    # secret_key encrypts data in the database (e.g. integration
    # credentials); losing it on uninstall/reinstall would break them.
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  {{- if not .Values.mautic.existingSecret }}
  secret-key: {{ include "mautic.secretValue" (dict "ctx" . "name" $name "key" "secret-key" "length" 64) }}
  {{- end }}
  {{- if not .Values.mautic.admin.existingSecret }}
  admin-password: {{ include "mautic.secretValue" (dict "ctx" . "name" $name "key" "admin-password" "length" 24) }}
  {{- end }}
  {{- if and .Values.mautic.oauth.enabled (not .Values.mautic.oauth.existingSecret) }}
  oauth-private-key: {{ include "mautic.secretRsaKey" (dict "ctx" . "name" $name "key" "oauth-private-key") }}
  oauth-encryption-key: {{ include "mautic.secretValue" (dict "ctx" . "name" $name "key" "oauth-encryption-key" "length" 64) }}
  {{- end }}
  {{- if and .Values.mautic.mailer.dsn (not .Values.mautic.mailer.existingSecret) }}
  mailer-dsn: {{ .Values.mautic.mailer.dsn | b64enc }}
  {{- end }}
{{- if include "mautic.db.needsPasswordSecret" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mautic.fullname" . }}-externaldb
  labels:
    {{- include "mautic.labels" . | nindent 4 }}
  {{- include "mautic.annotations" . | nindent 2 }}
type: Opaque
data:
  password: {{ required "externalDatabase.password or existingSecret + secretKeys.password is required" .Values.externalDatabase.password | b64enc }}
{{- end }}
