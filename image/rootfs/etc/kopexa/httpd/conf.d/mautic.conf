# Mautic additions to the hardened php-apache base configuration
# (/etc/kopexa/httpd/httpd.conf). Mautic's own .htaccess files stay active
# (APACHE_ALLOW_OVERRIDE=All); the rules below are defence in depth that does
# not depend on them.

# User uploads must never execute. Mautic's media/images/.htaccess only
# disables PHP for mod_php4-6, not for PHP 8.
<Directory "/app/docroot/media">
    php_admin_flag engine off
    Options -ExecCGI -Indexes
    <FilesMatch "\.(php[0-9]?|phtml|phar|pl|py|cgi|sh)$">
        Require all denied
    </FilesMatch>
</Directory>

# Assets are served through Mautic's controller; no direct access.
<Directory "/app/docroot/media/files">
    Require all denied
</Directory>

# Long-lived caching for generated assets.
<Directory "/app/docroot/media/js">
    ExpiresActive On
    ExpiresDefault "access plus 7 days"
</Directory>
<Directory "/app/docroot/media/css">
    ExpiresActive On
    ExpiresDefault "access plus 7 days"
</Directory>
