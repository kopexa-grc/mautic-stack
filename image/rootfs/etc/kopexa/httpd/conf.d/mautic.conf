# Mautic additions to the hardened php-apache base configuration
# (/etc/kopexa/httpd/httpd.conf). Mautic's own .htaccess files stay active
# (APACHE_ALLOW_OVERRIDE=All); the rules below are defence in depth that does
# not depend on them.

# Web requests cannot start processes: there is no shell in the image, and
# these functions are disabled for mod_php (the CLI used by the entrypoint,
# cron and workers is not affected). Limits post-exploitation after a PHP
# code-execution bug (e.g. CVE-2026-109618 "PHP2Shell").
php_admin_value disable_functions "exec,passthru,shell_exec,system,popen,proc_open,pcntl_exec,dl"

# User uploads must never execute. Mautic's media/images/.htaccess only
# disables PHP for mod_php4-6, not for PHP 8.
<Directory "/app/docroot/media">
    php_admin_flag engine off
    Options -ExecCGI -Indexes
    <FilesMatch "\.(php[0-9]?|phtml|phar|pl|py|cgi|sh)$">
        Require all denied
    </FilesMatch>
</Directory>

# Language packs (on the persistent volume in Kubernetes, so the image's
# translations/.htaccess is hidden there): never served directly.
<Directory "/app/docroot/translations">
    Require all denied
</Directory>

# Assets are served through Mautic's controller; no direct access.
<Directory "/app/docroot/media/files">
    Require all denied
</Directory>

# Long-lived caching for generated assets.
<Directory "/app/docroot/media/js">
    ExpiresActive On
    ExpiresDefault "access plus 7 days"
</Directory>
<Directory "/app/docroot/media/css">
    ExpiresActive On
    ExpiresDefault "access plus 7 days"
</Directory>

# OAuth/MCP discovery documents (RFC 8414, RFC 9728) are answered by Mautic
# (kopexa/mautic-oauth-bundle, kopexa/mautic-mcp-bundle). The base config
# denies every path starting with a dot; these two are allowed (Location
# sections are merged after Files sections) and reach index.php through
# Mautic's front-controller rewrite. The rest of /.well-known stays denied.
<LocationMatch "^/\.well-known/(oauth-authorization-server|oauth-protected-resource)(/|$)">
    Require all granted
</LocationMatch>

# Proxy headers are evaluated once, by Mautic (Symfony trusted_proxies), not
# also by Apache. The base config lets mod_remoteip replace the client
# address from X-Forwarded-For; Symfony then saw that (public) address as
# the peer instead of the ingress, did not trust it and ignored
# X-Forwarded-Proto: behind Cloudflare or any other public hop every https
# request looked like http and was redirected to https again (301 loop).
# Pointing mod_remoteip at a header nobody sends turns it off; the access
# log shows the proxy address, Mautic itself records the client IP.
RemoteIPHeader X-Kopexa-Remoteip-Disabled
