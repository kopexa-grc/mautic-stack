name: image

# Mautic image on the hardened kopexa php-apache base.
#
#   pull_request  -> build amd64, end-to-end smoke test, scan (no publish)
#   push (main)   -> + native amd64/arm64 builds, multi-arch publish to GHCR,
#                    cosign signature, SBOM + SLSA provenance
#   schedule      -> daily rebuild to pick up base image security fixes

on:
  push:
    branches: [main]
    paths: [image/**, test/**, .github/workflows/image.yml]
  pull_request:
    paths: [image/**, test/**, .github/workflows/image.yml]
  schedule:
    - cron: "47 5 * * *"   # after kopexa-grc/images (04:23)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mautic
  # renovate: datasource=docker depName=anchore/grype
  GRYPE_IMAGE: anchore/grype:v0.121.0
  # renovate: datasource=docker depName=goodwithtech/dockle
  DOCKLE_IMAGE: goodwithtech/dockle:v0.4.15

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versions and tags
        id: meta
        run: |
          v="$(sed -n 's/^ARG MAUTIC_VERSION=//p' image/Dockerfile | head -1)"
          IFS=. read -r major minor _ <<<"$v"
          d="$(date -u +%Y%m%d)"
          tags="$IMAGE:$v,$IMAGE:$major.$minor,$IMAGE:$major,$IMAGE:latest,$IMAGE:$v-$d"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          { echo "### Mautic $v"; for t in ${tags//,/ }; do echo "- \`$t\`"; done; } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image
          platforms: linux/amd64
          load: true
          tags: mautic:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Smoke test (install, web, console, worker)
        run: test/smoke.sh mautic:ci

      - name: Vulnerability gate (high/critical with a fix available)
        run: |
          docker save mautic:ci -o /tmp/image.tar
          docker run --rm -v /tmp:/w "$GRYPE_IMAGE" docker-archive:/w/image.tar \
            --only-fixed --fail-on high -o table

      - name: CIS Docker benchmark (dockle)
        # CIS-DI-0005: replaced by cosign signatures.
        # CIS-DI-0006: Kubernetes probes are used instead of HEALTHCHECK.
        run: |
          docker run --rm -v /tmp:/w "$DOCKLE_IMAGE" --input /w/image.tar \
            --exit-code 1 --exit-level warn -i CIS-DI-0005 -i CIS-DI-0006

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        id: manifest
        env:
          TAGS: ${{ needs.test.outputs.tags }}
        run: |
          args=()
          for t in ${TAGS//,/ }; do args+=(-t "$t"); done
          sources=()
          for d in /tmp/digests/*; do sources+=("$IMAGE@sha256:$(basename "$d")"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:${{ needs.test.outputs.version }}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        run: cosign sign --yes --recursive "$IMAGE@${{ steps.manifest.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
