name: chart

# Lint + schema validation of every values file in charts/mautic/ci, an
# end-to-end install on k3s (restricted PSS, NetworkPolicies, HTTPS ingress, email, backup + restore) on three Kubernetes versions, an upgrade from the last release, and
# OCI release of the chart when its version changes on main.

on:
  push:
    branches: [main]
    paths: [charts/**, image/**, test/**, .github/workflows/chart.yml]
  pull_request:
    paths: [charts/**, image/**, test/**, .github/workflows/chart.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CHART: charts/mautic
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v3.19.0
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.7.0

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: helm lint + kubeconform (all ci/*.yaml)
        run: |
          for f in "$CHART"/ci/*-values.yaml; do
            echo "::group::$f"
            helm lint "$CHART" -f "$f" --strict
            helm template test "$CHART" -f "$f" | kubeconform -strict -summary \
              -kubernetes-version 1.31.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
      - name: Required values fail loudly
        run: |
          if helm template test "$CHART" >/dev/null 2>&1; then
            echo "::error::rendering without mautic.siteUrl must fail"; exit 1
          fi
          helm template test "$CHART" 2>&1 | grep -q 'mautic.siteUrl is required'

  e2e:
    name: e2e on k3s ${{ matrix.k3s }}
    runs-on: ubuntu-24.04
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # oldest supported (Chart.yaml kubeVersion), a middle one, newest
        k3s: [v1.29.15+k3s1, v1.32.13+k3s1, v1.35.9+k3s1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: ./.github/actions/k3s
        with:
          version: ${{ matrix.k3s }}
      - name: End-to-end (restricted PSS, NetworkPolicies, HTTPS ingress, email, backup + restore)
        run: test/e2e-k3s.sh /tmp/mautic.tar mautic:e2e
      - name: Diagnostics
        if: failure()
        run: &diagnostics |
          for ns in mautic mautic-upgrade restore mail backup-target; do
            kubectl get ns "$ns" >/dev/null 2>&1 || continue
            echo "##### $ns"; kubectl -n "$ns" get all,ingress,pvc,events 2>/dev/null | tail -60 || true
            for p in $(kubectl -n "$ns" get pods -o name 2>/dev/null); do
              echo "=== $p"; kubectl -n "$ns" logs "$p" --all-containers --tail=60 || true
            done
          done

  upgrade:
    name: upgrade from last release (k3s)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: ./.github/actions/k3s
        with:
          # renovate: datasource=github-releases depName=k3s-io/k3s
          version: v1.35.9+k3s1
      - name: Upgrade last published chart + image to this commit
        run: test/upgrade-k3s.sh /tmp/mautic.tar mautic:e2e
      - name: Diagnostics
        if: failure()
        run: *diagnostics

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e, upgrade]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Version already published?
        id: check
        run: |
          v="$(sed -n 's/^version: //p' "$CHART/Chart.yaml")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/chart-$v" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Package and push to GHCR (OCI)
        if: steps.check.outputs.exists != 'true'
        id: push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "$CHART" -d /tmp/chart
          out="$(helm push /tmp/chart/mautic-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1)"
          echo "$out"
          echo "digest=$(sed -n 's/^Digest: //p' <<<"$out")" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.check.outputs.exists != 'true'
      # cosign uses the Docker credential store, not Helm's.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.check.outputs.exists != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        if: steps.check.outputs.exists != 'true'
      - name: Publish Artifact Hub metadata
        if: steps.check.outputs.exists != 'true'
        run: |
          oras push "ghcr.io/${{ github.repository_owner }}/charts/mautic:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      - name: Sign chart and tag release
        if: steps.check.outputs.exists != 'true'
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/mautic@${{ steps.push.outputs.digest }}"
          git tag "chart-${{ steps.check.outputs.version }}"
          git push origin "chart-${{ steps.check.outputs.version }}"
