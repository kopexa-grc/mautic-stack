name: theme

# Quality gate for the Kopexa email themes (image/extensions/mautic-theme-kopexa*,
# QA tooling in mautic-theme-kopexa/qa), one job per theme:
# render with the MJML version Mautic's builder uses, static checks (size,
# links, images, a11y, brand palette, contrast), deliverability via Mailpit
# + rspamd (client compatibility, link check, spam score), screenshots.

on:
  push:
    branches: [main]
    paths: [image/extensions/mautic-theme-kopexa*/**, .github/workflows/theme.yml]
  pull_request:
    paths: [image/extensions/mautic-theme-kopexa*/**, .github/workflows/theme.yml]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: image/extensions/mautic-theme-kopexa/qa

jobs:
  qa:
    name: qa (${{ matrix.theme }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        theme: [mautic-theme-kopexa, mautic-theme-kopexa-confirm, mautic-theme-kopexa-hero]
    env:
      THEME: ../../${{ matrix.theme }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: image/extensions/mautic-theme-kopexa/qa/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Render (MJML 4.15.3, as Mautic's builder)
        run: node render.mjs "$THEME"
      - name: Static checks
        run: node check.mjs "$THEME"
      - name: Deliverability (client compatibility, links, rspamd)
        run: ./deliverability.sh "$THEME"
      - name: Screenshots
        if: always()
        run: |
          npx playwright install --with-deps chromium
          node screenshots.mjs "$THEME"
          git -C "$GITHUB_WORKSPACE" diff --quiet -- "image/extensions/${{ matrix.theme }}/thumbnail.png" \
            || echo "::notice::thumbnail.png of ${{ matrix.theme }} changed — commit the new one from the artifact"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: theme-qa-${{ matrix.theme }}
          path: |
            image/extensions/mautic-theme-kopexa/qa/dist
            image/extensions/${{ matrix.theme }}/thumbnail.png
          retention-days: 30
