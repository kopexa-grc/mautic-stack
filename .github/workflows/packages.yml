name: packages

# Our Mautic extensions (image/extensions/*) as standalone Composer packages.
#
# check: every package is publishable (hack/check-packages.sh).
# split: mirrors each package into its own read-only repository
#        (kopexa-grc/<directory>) and tags new versions (v<VERSION>), which
#        Packagist picks up. Disabled until the repository variable
#        PACKAGES_SPLIT is "true" and the secret PACKAGES_SPLIT_TOKEN exists;
#        see docs/publishing.md.

on:
  push:
    branches: [main]
    paths: [image/extensions/**, hack/check-packages.sh, .github/workflows/packages.yml]
  pull_request:
    paths: [image/extensions/**, hack/check-packages.sh, .github/workflows/packages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Packages are publishable
        run: |
          docker run --rm -v "$PWD:/r" -w /r --entrypoint bash \
            ghcr.io/kopexa-grc/php-apache:8.4-dev hack/check-packages.sh

  split:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PACKAGES_SPLIT == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [mautic-oauth-bundle, mautic-mcp-bundle, mautic-postal-bundle, mautic-theme-kopexa]
    concurrency:
      group: split-${{ matrix.package }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Split and push to kopexa-grc/${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
          TOKEN: ${{ secrets.PACKAGES_SPLIT_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::secret PACKAGES_SPLIT_TOKEN is not set"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Deterministic: the same history always gives the same commits,
          # so the mirror only ever moves forward.
          sha="$(git subtree split --prefix="image/extensions/$PACKAGE")"
          remote="https://x-access-token:${TOKEN}@github.com/kopexa-grc/${PACKAGE}.git"
          git push "$remote" "$sha:refs/heads/main"
          version="$(tr -d '[:space:]' < "image/extensions/$PACKAGE/VERSION")"
          if git ls-remote --exit-code --tags "$remote" "refs/tags/v$version" >/dev/null; then
            echo "v$version already tagged"
          else
            git tag -a "v$version" "$sha" -m "$PACKAGE $version"
            git push "$remote" "refs/tags/v$version"
            echo "Tagged $PACKAGE v$version" >> "$GITHUB_STEP_SUMMARY"
          fi
